services:
  pengamanan-api:
    image: ghcr.io/hadirapp-com/pengamanan-api:latest
    container_name: pengamanan-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production

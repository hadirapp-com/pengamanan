services:
  api:
    image: pokayoke-api:latest
    container_name: pokayoke-api
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      BASE_URL: ${BASE_URL}
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-http://host.docker.internal:4000}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

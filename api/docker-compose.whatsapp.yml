services:
  # WhatsApp Web MultiDevice Service
  whatsapp:
    image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice:v7.11.4
    container_name: pokayoke-whatsapp
    ports:
      - "4000:3000"
    environment:
      SERVER_PORT: 4000
      APP_BASIC_AUTH: ${WHATSAPP_BASIC_AUTH:-admin:admin}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-120363425711188214}
      WHATSAPP_AUTO_MARK_READ: ${WHATSAPP_AUTO_MARK_READ:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - whatsapp:/app/storages
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  whatsapp:
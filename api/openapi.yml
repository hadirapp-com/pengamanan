openapi: 3.0.3
info:
  title: Pengamanan API
  description: |
    API untuk sistem pengamanan Lebaran Blok F RT 024.

    Fitur:
    - QR Code management dan scanning
    - Manajemen petugas jaga dan pos jaga
    - Sistem pengumuman
    - Scan logs dengan filter
    - Mobile authentication dengan PIN
    - Offline sync support

    Base URL: `https://blokf.hadirapp.com/api`
  version: 1.1.0
  contact:
    name: Blok F RT 024
    email: admin@blokf.hadirapp.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:5000/api
    description: Local development server
  - url: https://blokf.hadirapp.com/api
    description: Production server

tags:
  - name: Authentication
    description: Admin authentication endpoints
  - name: Mobile Auth
    description: Mobile PIN-based authentication
  - name: Users
    description: User management (admin/superadmin only)
  - name: Petugas
    description: Security guards management
  - name: Pos
    description: Security posts management
  - name: QR Codes
    description: QR code generation and management
  - name: Pengumuman
    description: Announcements management
  - name: Mobile
    description: Mobile app endpoints (scan, sync)
  - name: Logs
    description: Scan logs and reporting
  - name: Configs
    description: Application configuration

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login admin user
      description: Authenticate admin user with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: superadmin
                password:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    description: JWT token valid for 24 hours
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get authenticated user information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate current session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change authenticated user's password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Password changed successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /mobile/auth/pin:
    post:
      tags:
        - Mobile Auth
      summary: Mobile PIN authentication
      description: Authenticate mobile app with 6-digit PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pin
              properties:
                pin:
                  type: string
                  pattern: '^\\d{6}$'
                  example: "123456"
                  description: 6-digit PIN
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
                    description: JWT token valid for 90 days
                  data:
                    type: object
                    properties:
                      petugasId:
                        type: string
                        format: uuid
                      nama:
                        type: string
                        example: "Petugas Jaga"
        '400':
          $ref: '#/components/responses/ValidationError'
          description: Invalid PIN format
        '401':
          description: Incorrect PIN
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "PIN salah"

  /users:
    get:
      tags:
        - Users
      summary: List all users
      description: Get paginated list of users (admin/superadmin only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Users
      summary: Create user
      description: Create new user (superadmin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - role
              properties:
                username:
                  type: string
                  minLength: 3
                password:
                  type: string
                  format: password
                  minLength: 6
                role:
                  type: string
                  enum: [superadmin, admin]
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User retrieved successfully
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                role:
                  type: string
                  enum: [superadmin, admin]
      responses:
        '200':
          description: User updated successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Users
      summary: Delete user (soft delete)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/reset-password:
    post:
      tags:
        - Users
      summary: Reset user password
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Password reset successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /petugas:
    get:
      tags:
        - Petugas
      summary: List all petugas jaga
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: Petugas list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Petugas'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Petugas
      summary: Create petugas jaga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetugasInput'
      responses:
        '201':
          description: Petugas created successfully
        '400':
          $ref: '#/components/responses/ValidationError'

  /petugas/{id}:
    get:
      tags:
        - Petugas
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Petugas retrieved
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Petugas
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetugasInput'
      responses:
        '200':
          description: Petugas updated
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Petugas
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Petugas deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /pos:
    get:
      tags:
        - Pos
      summary: List all pos jaga
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: Pos list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pos'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Pos
      summary: Create pos jaga
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosInput'
      responses:
        '201':
          description: Pos created successfully

  /pos/{id}:
    get:
      tags:
        - Pos
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Pos retrieved
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Pos
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosInput'
      responses:
        '200':
          description: Pos updated

    delete:
      tags:
        - Pos
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Pos deleted

  /qr:
    get:
      tags:
        - QR Codes
      summary: List all QR codes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: QR codes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QRCode'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - QR Codes
      summary: Generate QR code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodeInput'
      responses:
        '201':
          description: QR code generated successfully

  /qr/generate:
    post:
      tags:
        - QR Codes
      summary: Generate new QR UUID
      description: Generate a new UUID for QR code without creating database entry
      security:
        - BearerAuth: []
      responses:
        '200':
          description: UUID generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      qrCode:
                        type: string
                        format: uuid

  /qr/{id}/image:
    get:
      tags:
        - QR Codes
      summary: Download QR image
      description: Download QR code as PNG image
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: QR image (PNG)
          content:
            image/png:
              schema:
                type: string
                format: binary

  /qr/pdf:
    post:
      tags:
        - QR Codes
      summary: Generate PDF of QR codes
      description: Generate PDF containing multiple QR codes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qrIds
              properties:
                qrIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: PDF generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /qr/{id}/toggle:
    patch:
      tags:
        - QR Codes
      summary: Toggle QR active status
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: QR status toggled

  /qr/{id}:
    get:
      tags:
        - QR Codes
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: QR retrieved
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - QR Codes
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodeInput'
      responses:
        '200':
          description: QR updated

    delete:
      tags:
        - QR Codes
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: QR deleted

  /pengumuman:
    get:
      tags:
        - Pengumuman
      summary: List all pengumuman
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: priority
          schema:
            type: string
            enum: [normal, important, urgent]
      responses:
        '200':
          description: Pengumuman retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pengumuman'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Pengumuman
      summary: Create pengumuman
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PengumumanInput'
      responses:
        '201':
          description: Pengumuman created

  /pengumuman/{id}:
    get:
      tags:
        - Pengumuman
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Pengumuman retrieved

    put:
      tags:
        - Pengumuman
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PengumumanInput'
      responses:
        '200':
          description: Pengumuman updated

    delete:
      tags:
        - Pengumuman
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Pengumuman deleted

  /mobile/scan:
    post:
      tags:
        - Mobile
      summary: Scan QR code
      description: Scan QR code and create log entry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qrCode
                - petugasId
                - posId
                - tipeScan
              properties:
                qrCode:
                  type: string
                  format: uuid
                  description: QR code UUID to scan
                petugasId:
                  type: string
                  format: uuid
                  description: Petugas ID performing scan
                posId:
                  type: string
                  format: uuid
                  description: Pos ID where scan occurred
                tipeScan:
                  type: string
                  enum: [masuk, keluar]
                  description: Scan type
      responses:
        '200':
          description: Scan successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      scan:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          scannedAt:
                            type: string
                            format: date-time
                      tipeScan:
                        type: string
                        enum: [masuk, keluar]
                      qr:
                        type: object
                        properties:
                          nama:
                            type: string
                            example: "Block A-101"
                          penanggungJawab:
                            type: string
                            example: "Bpk. Ahmad"
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: QR Code not found or inactive
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "QR Code tidak valid atau tidak aktif"
                  message:
                    type: string
                    example: "QR code tidak ditemukan atau sudah tidak aktif"

  /mobile/sync:
    get:
      tags:
        - Mobile
      summary: Sync master data
      description: Get all master data (petugas, pos, QR codes, pengumuman)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Master data synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      petugas:
                        type: array
                        items:
                          $ref: '#/components/schemas/Petugas'
                      pos:
                        type: array
                        items:
                          $ref: '#/components/schemas/Pos'
                      qrCodes:
                        type: array
                        items:
                          $ref: '#/components/schemas/QRCode'
                      pengumuman:
                        type: array
                        items:
                          $ref: '#/components/schemas/Pengumuman'

  /mobile/pengumuman:
    get:
      tags:
        - Mobile
      summary: Get pengumuman for mobile
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: deviceId
          schema:
            type: string
          description: Device ID to filter read pengumuman
      responses:
        '200':
          description: Pengumuman retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pengumuman'

  /mobile/sync-logs:
    post:
      tags:
        - Mobile
      summary: Sync offline logs
      description: Upload offline scan logs from mobile device
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - logs
              properties:
                logs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - qrCode
                      - petugasId
                      - posId
                      - tipeScan
                      - scannedAt
                    properties:
                      qrCode:
                        type: string
                        format: uuid
                      petugasId:
                        type: string
                        format: uuid
                      posId:
                        type: string
                        format: uuid
                      tipeScan:
                        type: string
                        enum: [masuk, keluar]
                      scannedAt:
                        type: string
                        format: date-time
      responses:
        '200':
          description: Logs synced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      synced:
                        type: integer
                        description: Number of logs synced
                      failed:
                        type: integer
                        description: Number of logs failed to sync
        '400':
          $ref: '#/components/responses/ValidationError'

  /mobile/read-announce:
    post:
      tags:
        - Mobile
      summary: Mark pengumuman as read
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pengumumanIds
                - deviceId
              properties:
                pengumumanIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                deviceId:
                  type: string
                  description: Unique device identifier
      responses:
        '200':
          description: Pengumuman marked as read

  /logs:
    get:
      tags:
        - Logs
      summary: List scan logs
      description: Get paginated scan logs with filters
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - in: query
          name: perPage
          schema:
            type: integer
            default: 10
        - $ref: '#/components/parameters/search'
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
            example: "2026-03-01"
            description: Filter start date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
            example: "2026-03-31"
            description: Filter end date (YYYY-MM-DD)
        - in: query
          name: posId
          schema:
            type: string
            format: uuid
        - in: query
          name: petugasId
          schema:
            type: string
            format: uuid
        - in: query
          name: tipeScan
          schema:
            type: string
            enum: [masuk, keluar]
        - in: query
          name: sortCol
          schema:
            type: string
            enum: [scanned_at, petugas_nama, pos_nama, qr_nama]
            default: scanned_at
        - in: query
          name: sortDir
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: Logs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Log'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /logs/stats:
    get:
      tags:
        - Logs
      summary: Get dashboard statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalScans:
                        type: integer
                      todayScans:
                        type: integer
                      uniqueScans:
                        type: integer
                      masukCount:
                        type: integer
                      keluarCount:
                        type: integer

  /logs/export:
    get:
      tags:
        - Logs
      summary: Export logs to Excel
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Excel file generated
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /logs/{id}:
    delete:
      tags:
        - Logs
      summary: Delete log entry
      description: Delete a synced log entry (cannot delete unsynced logs)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Log deleted
        '400':
          description: Cannot delete unsynced log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Tidak bisa menghapus data yang belum disinkronkan ke server"
        '404':
          $ref: '#/components/responses/NotFound'

  /configs:
    get:
      tags:
        - Configs
      summary: List all configs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - in: query
          name: isActive
          schema:
            type: boolean
      responses:
        '200':
          description: Configs retrieved

    post:
      tags:
        - Configs
      summary: Create config
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigInput'
      responses:
        '201':
          description: Config created

  /configs/{key}:
    get:
      tags:
        - Configs
      summary: Get config by key
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
            example: "APP_TITLE"
      responses:
        '200':
          description: Config retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /configs/{id}:
    put:
      tags:
        - Configs
      summary: Update config
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigInput'
      responses:
        '200':
          description: Config updated

    delete:
      tags:
        - Configs
      summary: Delete config
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Config deleted

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login or PIN authentication

  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Resource ID (UUID)

    page:
      in: query
      name: page
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number

    perPage:
      in: query
      name: perPage
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Items per page

    search:
      in: query
      name: search
      schema:
        type: string
      description: Search keyword

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [superadmin, admin]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Petugas:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nama:
          type: string
          example: "Bpk. Joko"
        nik:
          type: string
          example: "1234567890123456"
        noHp:
          type: string
          example: "081234567890"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PetugasInput:
      type: object
      required:
        - nama
        - nik
        - noHp
      properties:
        nama:
          type: string
        nik:
          type: string
          pattern: '^\\d{16}$'
        noHp:
          type: string
          pattern: '^\\d{10,15}$'

    Pos:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nama:
          type: string
          example: "Pos 1 Utama"
        lokasi:
          type: string
          example: "Gerbang Utama"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PosInput:
      type: object
      required:
        - nama
        - lokasi
      properties:
        nama:
          type: string
        lokasi:
          type: string

    QRCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        qrCode:
          type: string
          format: uuid
        nama:
          type: string
          example: "Block A-101"
        penanggungJawab:
          type: string
          example: "Bpk. Ahmad"
        validFrom:
          type: string
          format: date
          example: "2026-03-10"
        validUntil:
          type: string
          format: date
          example: "2026-04-10"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QRCodeInput:
      type: object
      required:
        - nama
        - penanggungJawab
        - validFrom
        - validUntil
      properties:
        nama:
          type: string
        penanggungJawab:
          type: string
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date

    Pengumuman:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "Jam Malam Dimulai Pukul 22:00"
        content:
          type: string
          example: "Diberitahukan bahwa jam malam akan dimulai pukul 22:00"
        priority:
          type: string
          enum: [normal, important, urgent]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PengumumanInput:
      type: object
      required:
        - title
        - content
        - priority
      properties:
        title:
          type: string
        content:
          type: string
        priority:
          type: string
          enum: [normal, important, urgent]

    Log:
      type: object
      properties:
        id:
          type: string
          format: uuid
        qrNama:
          type: string
          example: "Block A-101"
        qrPenanggungJawab:
          type: string
          example: "Bpk. Ahmad"
        petugasNama:
          type: string
          example: "Bpk. Joko"
        posNama:
          type: string
          example: "Pos 1 Utama"
        posLokasi:
          type: string
          example: "Gerbang Utama"
        tipeScan:
          type: string
          enum: [masuk, keluar]
        scannedAt:
          type: string
          format: date-time
        synced:
          type: boolean
          description: Whether log is synced to server

    ConfigInput:
      type: object
      required:
        - key
        - value
        - description
      properties:
        key:
          type: string
          example: "APP_TITLE"
        value:
          type: string
          example: "Pengamanan Lebaran"
        description:
          type: string
          example: "Judul aplikasi untuk home screen"
        isActive:
          type: boolean

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation Error"
        message:
          type: string
          example: "Detailed error message"
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string
              code:
                type: string

  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Unauthorized"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Forbidden"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Not Found"
              message:
                type: string
                example: "The requested resource does not exist"

    ValidationError:
      description: Validation Error - Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Internal Server Error"
              message:
                type: string
                example: "Database connection failed"
